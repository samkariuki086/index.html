<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    /* Body & background */
    body {
      font-family: 'Pacifico', cursive;
      margin: 0;
      padding: 0;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      text-align: center;
      color: white;
    }

    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* Main Question */
    h1 {
      font-size: clamp(1.8rem, 6vw, 3rem);
      margin: 20px 0;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      opacity: 0;
      animation: fadeIn 2s forwards;
    }
    @keyframes fadeIn { to {opacity:1;} }

    /* Image */
    img {
      max-width: 70vw;
      width: 250px;
      margin: 20px 0;
      transition: transform 0.5s ease;
      animation: floatImage 2s infinite alternate;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    @keyframes floatImage { from {transform: translateY(0);} to {transform: translateY(-15px);} }

    /* Buttons */
    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      padding: 15px 35px;
      font-size: clamp(1rem, 5vw, 1.5rem);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 2px 2px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      position: relative;
      min-width: 120px;
    }
    button:hover { transform: scale(1.1); box-shadow: 4px 4px 20px rgba(0,0,0,0.3); }

    #yes { background-color: #ff4d6d; color: white; }
    #no { background-color: #ffc0cb; color: white; }

    /* Floating hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 5s linear infinite;
      z-index: 1;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }

    @keyframes float {
      0% { transform: translateY(0) rotate(45deg); opacity:1; }
      100% { transform: translateY(-800px) rotate(45deg); opacity:0; }
    }

    /* Confetti hearts */
    .confetti {
      position: absolute;
      width: 15px;
      height: 15px;
      background: red;
      transform: rotate(45deg);
      pointer-events: none;
      animation: confettiFall 3s forwards;
      z-index: 2;
    }
    .confetti::before,
    .confetti::after {
      content:"";
      position: absolute;
      width: 15px;
      height: 15px;
      background: red;
      border-radius: 50%;
    }
    .confetti::before { top: -7.5px; left: 0; }
    .confetti::after { left: 7.5px; top: 0; }

    @keyframes confettiFall {
      0% {opacity:1; transform: translateY(0) rotate(45deg);}
      100% {opacity:0; transform: translateY(600px) rotate(360deg);}
    }
  </style>
</head>
<body>

  <h1 id="question">Will you be my Valentine? 💘</h1>

  <img id="image" src="MINION.jpg" alt="Begging cartoon">

  <div class="button-container">
    <button id="yes" onclick="yesClick()">YES 💖</button>
    <button id="no" onclick="noClick()">NO 😭</button>
  </div>

  <script>
    let noCount = 0;
    const messages = [
      "Are you sure? 🥺",
      "Really really sure? 😢",
      "Please think again 💔",
      "I’ll do anything 😭",
      "This is breaking my heart 💘",
      "Last chance 😔"
    ];

    // Floating hearts background
    function spawnHearts() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random()*window.innerWidth + "px";
      heart.style.width = heart.style.height = (10+Math.random()*30) + "px";
      heart.style.animationDuration = (5+Math.random()*5)+"s";
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(), 8000);
    }
    setInterval(spawnHearts, 400);

    function noClick() {
      noCount++;
      document.getElementById("question").innerText =
        messages[Math.min(noCount-1, messages.length-1)];

      // Make YES bigger
      let yesBtn = document.getElementById("yes");
      yesBtn.style.fontSize = 1.5 + noCount*0.2 + "em";
      yesBtn.style.padding = 20 + noCount*5 + "px 40px";

      // Move NO button randomly
      const noBtn = document.getElementById("no");
      noBtn.style.position = "relative";
      noBtn.style.left = Math.floor(Math.random() * 100 - 50) + "px";
      noBtn.style.top = Math.floor(Math.random() * 50 - 25) + "px";
    }

    function yesClick() {
      document.body.innerHTML = `
        <h1>YAYYYY!!! 🥳💖</h1>
        <p>I knew you’d say yes 😘</p>
        <img src="MINHAPPY.jpg" style="max-width:70vw; width:300px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2)">
      `;

      // Celebration confetti
      for(let i=0;i<50;i++){
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random()*window.innerWidth + "px";
        confetti.style.animationDuration = (2+Math.random()*2) + "s";
        confetti.style.width = confetti.style.height = (10+Math.random()*20)+"px";
        document.body.appendChild(confetti);
        setTimeout(()=>confetti.remove(), 3000);
      }
    }
  </script>

</body>
</html>
